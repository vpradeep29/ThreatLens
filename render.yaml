services:
  - type: web
    name: lvs-scanner-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./scan_history.db
      - key: ALLOWED_ORIGINS
        value: "*" # Update this to your Vercel URL later for better security
      - key: API_TITLE
        value: LVS-Advanced-Scanner API
      - key: PYTHON_VERSION
        value: 3.11.6
